name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE_SHA" = '0000000000000000000000000000000000000000' ]; then
            BASE_SHA=$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH" || true)
          fi
          if [ -n "$BASE_SHA" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA"
          fi
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --ignore-gitleaks-allow --log-opts="$RANGE" /repo
