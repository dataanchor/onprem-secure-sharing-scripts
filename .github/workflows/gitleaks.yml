name: Secret scan

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    if: ${{ github.event_name != 'push' || !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan introduced commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git cat-file -e "$HEAD_SHA^{commit}"
          SCAN_BASE=
          if [ -n "$BASE_SHA" ] &&
             [ "$BASE_SHA" != '0000000000000000000000000000000000000000' ] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            SCAN_BASE="$BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            SCAN_BASE=$(git merge-base "$HEAD_SHA" "origin/$BASE_REF" || true)
          elif [ "$GITHUB_EVENT_NAME" = push ] &&
               [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            SCAN_BASE=$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH" || true)
          fi
          if [ -n "$SCAN_BASE" ] &&
             git cat-file -e "$SCAN_BASE^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "$SCAN_BASE" "$HEAD_SHA" &&
             [ "$SCAN_BASE" != "$HEAD_SHA" ]; then
            RANGE="$SCAN_BASE..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA"
          fi
          docker run --rm --network none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --ignore-gitleaks-allow --log-opts="$RANGE" /repo
